name: FX Watch (Exchange Rates)

on:
  schedule:
    # 평일 한국 업무시간(09-18 KST = 00-09 UTC, 월-금) 동안 30분 간격.
    - cron: "*/30 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      threshold:
        description: "환율 변동 경보 임계치(%)"
        required: false
        default: "1.5"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scheduled
    env:
      FINANCE_WATCH_THRESHOLD: ${{ inputs.threshold || '1.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scheduled/package-lock.json

      - run: npm ci

      - name: Write .env and .mcp.json from secrets
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > ../.env
          echo '${{ secrets.MCP_CONFIG_JSON }}' > ../.mcp.json
          echo '${{ secrets.CONFIG_LOCAL_MD }}' > ../config.local.md

      - run: npm run finance-watch

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-watch-${{ github.run_id }}
          path: scheduled/out/
