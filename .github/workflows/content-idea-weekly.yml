name: Content Idea Weekly

on:
  schedule:
    # 매주 월요일 00:00 UTC = 09:00 KST
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scheduled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scheduled/package-lock.json

      - run: npm ci

      - name: Write .env and .mcp.json from secrets
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > ../.env
          echo '${{ secrets.MCP_CONFIG_JSON }}' > ../.mcp.json
          echo '${{ secrets.CONFIG_LOCAL_MD }}' > ../config.local.md

      - run: npm run content-idea-weekly

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-idea-weekly-${{ github.run_id }}
          path: scheduled/out/
