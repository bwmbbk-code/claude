name: Daily Brief

on:
  schedule:
    # 매일 23:00 UTC = 08:00 KST (다음 날)
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scheduled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scheduled/package-lock.json

      - run: npm ci

      - name: Write .env and .mcp.json from secrets
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > ../.env
          echo '${{ secrets.MCP_CONFIG_JSON }}' > ../.mcp.json
          echo '${{ secrets.CONFIG_LOCAL_MD }}' > ../config.local.md

      - run: npm run daily-brief

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-${{ github.run_id }}
          path: scheduled/out/
