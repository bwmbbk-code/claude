name: Deploy Golf Handicap to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/golf-handicap-calculator-scgkfn
    paths:
      - 'golf-handicap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: golf-handicap/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: golf-handicap

      - name: Build
        run: npm run build
        working-directory: golf-handicap
        env:
          GITHUB_ACTIONS: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: golf-handicap/dist
          cname: ''
